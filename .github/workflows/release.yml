name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.4.19)
        required: true
        type: string
      allow_unsigned_macos:
        description: Also publish unsigned macOS DMGs on a manual rerun when Apple signing secrets are missing
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  ALLOW_UNSIGNED_MACOS: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_macos) }}

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: reader
            name: linux-x86_64
          - os: macos-14
            target: x86_64-apple-darwin
            bin: reader
            name: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            bin: reader
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: reader.exe
            name: windows-x86_64

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate release version alignment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ./scripts/check-version.sh "${VERSION}"

      - name: Install dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Align Tauri NPM package versions
        shell: bash
        run: ./scripts/align-tauri-npm.sh

      - name: Detect macOS signing secrets
        if: startsWith(matrix.platform.os, 'macos-')
        id: macos_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED_MACOS: ${{ env.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail

          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            if [[ "${ALLOW_UNSIGNED_MACOS}" == "true" ]]; then
              echo "mode=unsigned" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Apple signing/notarization secrets are missing: ${missing[*]}. Continuing with an unsigned macOS DMG because allow_unsigned_macos=true."
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Skipping macOS DMG release because signing/notarization secrets are missing: ${missing[*]}"
            fi
            exit 0
          fi

          echo "mode=signed" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build application (macOS DMG, signed)
        if: startsWith(matrix.platform.os, 'macos-') && steps.macos_signing.outputs.mode == 'signed'
        run: npm run tauri build -- --target ${{ matrix.platform.target }} --bundles dmg
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build application (macOS DMG, unsigned)
        if: startsWith(matrix.platform.os, 'macos-') && steps.macos_signing.outputs.mode == 'unsigned'
        run: npm run tauri build -- --target ${{ matrix.platform.target }} --bundles dmg
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build application (non-macOS)
        if: ${{ !startsWith(matrix.platform.os, 'macos-') }}
        run: npm run tauri build -- --target ${{ matrix.platform.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Verify macOS bundle
        if: startsWith(matrix.platform.os, 'macos-') && steps.macos_signing.outputs.mode == 'signed'
        shell: bash
        run: ./scripts/verify-macos-bundle.sh "src-tauri/target/${{ matrix.platform.target }}/release/bundle"

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          # Set up output directory
          mkdir -p release

          copy_matches_if_dir_exists() {
            local dir="$1"
            local pattern="$2"
            if [[ -d "$dir" ]]; then
              find "$dir" -name "$pattern" -exec cp {} release/ \;
            else
              echo "Skip missing directory: $dir"
            fi
          }

          copy_macos_dmgs() {
            local dir="$1"
            local mode="$2"
            if [[ ! -d "$dir" ]]; then
              echo "Skip missing directory: $dir"
              return
            fi

            shopt -s nullglob
            local files=("$dir"/*.dmg)
            if (( ${#files[@]} == 0 )); then
              echo "No dmg files found under: $dir"
              return
            fi

            for file in "${files[@]}"; do
              local base
              base="$(basename "$file" .dmg)"
              if [[ "$mode" == "unsigned" ]]; then
                cp "$file" "release/${base}-unsigned.dmg"
              else
                cp "$file" release/
              fi
            done
          }

          # Platform-specific artifact handling
          if [[ "${{ matrix.platform.os }}" == "ubuntu-22.04" ]]; then
            # Linux: bundle/deb/*.deb and bundle/appimage/*.AppImage
            copy_matches_if_dir_exists "src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb" "*.deb"
            copy_matches_if_dir_exists "src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage" "*.AppImage"
          elif [[ "${{ matrix.platform.os }}" == macos-* ]]; then
            # macOS: bundle/dmg/*.dmg
            copy_macos_dmgs "src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg" "${{ steps.macos_signing.outputs.mode }}"
          elif [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            # Windows: bundle/msi/*.msi and bundle/nsis/*.exe
            find src-tauri/target/${{ matrix.platform.target }}/release/bundle -name "*.msi" -exec cp {} release/ \;
            find src-tauri/target/${{ matrix.platform.target }}/release/bundle -name "*.exe" -exec cp {} release/ \;
          fi

          # List artifacts for debugging
          ls -lh release/

      - name: Upload artifacts to GitHub
        if: ${{ !startsWith(matrix.platform.os, 'macos-') || steps.macos_signing.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: release/*

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release files
        run: |
          mkdir -p final_release
          for dir in release/*; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* final_release/
            fi
          done
          ls -lh final_release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: final_release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
